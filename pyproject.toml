[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-lite"
version = "0.1.0"
description = "Offline retrieval metrics and deterministic answer checks for RAG pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rag-eval-lite = "rag_eval_lite.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/rag-eval-lite"

[tool.setuptools]
packages = ["rag_eval_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
